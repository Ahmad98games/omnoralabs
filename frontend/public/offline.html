<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Connection Offline | Omnora OS</title>
    <style>
        :root {
            --bg: #050505;
            --gold: #D4AF37;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 10px var(--gold));
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        p {
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            background: var(--gold);
            color: #000;
            padding: 1rem 2rem;
            border-radius: 99px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }
        .pulse {
            width: 12px;
            height: 12px;
            background: #ff4757;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✦</div>
        <h1>Sovereign Intercept</h1>
        <p>The neural connection to Omnora Imperial is currently fragmented. This territory is currently operating in local isolation mode.</p>
        <div style="margin-bottom: 2rem;">
            <span class="pulse"></span>
            <span style="font-size: 0.8rem; color: #ff4757; font-weight: 600;">OFFLINE CORE ACTIVE</span>
        </div>
        <a href="javascript:window.location.reload()" class="btn">RE-ESTABLISH CONNECTION</a>
    </div>
</body>
</html>
